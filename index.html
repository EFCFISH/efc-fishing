<html lang="en">
<head>

<title>EFC Fishing Frenzy</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e1a;color:#fff;overflow:hidden;height:100vh}
.header{padding:15px;display:flex;justify-content:space-between;align-items:center;background:#151a2d}
.balance{background:linear-gradient(90deg,#FFD700,#FFA500);padding:10px 20px;border-radius:20px;color:#000;font-weight:bold}
.energy-box{margin:10px 20px;background:#1e2540;border-radius:15px;padding:12px}
.energy-bar{height:12px;background:#333;border-radius:10px;overflow:hidden;margin-top:8px}
.energy-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);width:85%;transition:0.3s}
.pond{margin:20px;height:38vh;background:radial-gradient(circle at 50% 30%,#1a3a5a,#0a1a2a);border-radius:25px;position:relative;display:flex;align-items:center;justify-content:center;border:2px solid #FFD700;cursor:pointer;user-select:none}
.fish-emoji{font-size:80px;animation:float 2s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.tap-text{position:absolute;bottom:20px;background:rgba(0,0,0,0.7);padding:8px 18px;border-radius:20px;font-weight:bold;color:#FFD700}
.coin-pop{position:absolute;color:#FFD700;font-weight:bold;font-size:22px;animation:pop 0.8s forwards;pointer-events:none}
@keyframes pop{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(1.5);opacity:0}}
.shop{display:flex;gap:12px;padding:0 20px;margin-top:10px}
.card{flex:1;background:#1e2540;border:1px solid #FFD700;border-radius:15px;padding:15px;text-align:center}
.card button{background:#FFD700;border:none;padding:8px 15px;border-radius:10px;font-weight:bold;margin-top:10px;width:100%;cursor:pointer}
.nav{position:fixed;bottom:0;width:100%;background:#151a2d;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #333}
