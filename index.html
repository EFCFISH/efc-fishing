<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFC Fishing Frenzy - Fixed</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e1a;color:#fff;min-height:100vh;padding-bottom:100px;overflow-y:auto}
.header{padding:15px;display:flex;justify-content:space-between;align-items:center;background:#151a2d}
.balance{background:linear-gradient(90deg,#FFD700,#FFA500);padding:10px 20px;border-radius:20px;color:#000;font-weight:bold;cursor:pointer}
.energy-box{margin:10px 20px;background:#1e2540;border-radius:15px;padding:12px}
.energy-bar{height:12px;background:#333;border-radius:10px;overflow:hidden;margin-top:8px}
.energy-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);width:100%;transition:0.3s}
.level-box{margin:0 20px 10px 20px;background:#1e2540;border-radius:12px;padding:10px 12px;border:1px solid #333}
.pond{margin:10px 20px 20px 20px;height:42vh;background:#0a1a2a;border-radius:25px;position:relative;display:flex;align-items:center;justify-content:center;border:2px solid #FFD700;cursor:pointer;overflow:hidden}
.pond-img{position:absolute;width:100%;height:100%;object-fit:cover;border-radius:23px;z-index:0;transition:0.15s}
.pond-img.meowing{transform:scale(1.06);filter:brightness(1.2) drop-shadow(0 0 12px #FFD700)}
.tap-text{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#00a6ff,#0066ff);padding:9px 22px;border-radius:22px;font-weight:bold;color:#fff;z-index:4;border:2px solid #FFD700}
.coin-pop{position:absolute;color:#FFD700;font-weight:bold;font-size:22px;animation:pop 0.8s forwards;pointer-events:none;z-index:9999}
@keyframes pop{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(1.5);opacity:0}}
.ripple{position:absolute;border:2px solid rgba(255,215,0,0.8);border-radius:50%;transform:translate(-50%,-50%);animation:rippleAnim 0.8s ease-out forwards;pointer-events:none;z-index:3}
@keyframes rippleAnim{0%{width:0;height:0;opacity:1}100%{width:280px;height:280px;opacity:0}}
.moving-fish{position:absolute;font-size:24px;pointer-events:none;z-index:2;animation:swimFish 4.5s linear forwards}
@keyframes swimFish{0%{transform:translateX(-60px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(100vw);opacity:0}}
.meow-pop{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:19px;font-weight:bold;color:#FFD700;background:rgba(0,0,0,0.7);padding:6px 16px;border-radius:18px;animation:meowUp 0.6s ease-out forwards;pointer-events:none;z-index:5;border:1px solid #FFD700}
@keyframes meowUp{0%{transform:translateX(-50%) translateY(10px) scale(0.5);opacity:0}50%{transform:translateX(-50%) translateY(-10px) scale(1.2);opacity:1}100%{transform:translateX(-50%) translateY(-45px) scale(1);opacity:0}}
.shop{display:flex;gap:12px;padding:0 20px;margin-top:10px}
.card{flex:1;background:#1e2540;border:1px solid #FFD700;border-radius:15px;padding:15px;text-align:center}
.card button{background:#FFD700;border:none;padding:8px 15px;border-radius:10px;font-weight:bold;margin-top:10px;width:100%;cursor:pointer}
.nav{position:fixed;bottom:0;width:100%;background:#151a2d;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #333;z-index:999}
.nav div{text-align:center;opacity:0.6;cursor:pointer}
.nav div.active{opacity:1;color:#FFD700}
#refModal,#balanceModal,#leaderModal,#appModal,#quizModal,#claimModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#1e2540;border:2px solid #FFD700;border-radius:20px;padding:20px;width:100%;max-width:380px;text-align:center;max-height:90vh;overflow-y:auto}
.btn-copy{background:#FFD700;color:#000;border:none;padding:12px;width:100%;border-radius:12px;font-weight:bold;margin-top:8px;cursor:pointer}
.btn-close{background:#333;color:#fff;border:none;padding:10px;width:100%;border-radius:8px;margin-top:10px;cursor:pointer}
.quiz-opt{background:#0a0e1a;border:1px solid #FFD700;color:#fff;padding:12px;border-radius:10px;width:100%;margin-top:8px;cursor:pointer;text-align:left}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e2540;border:1px solid #FFD700;padding:12px 20px;border-radius:25px;color:#FFD700;font-weight:bold;z-index:20000;display:none}
</style>
</head>
<body>
<div id="toast"></div>
<div class="header"><div><b>EFC Fishing Frenzy</b><br><small id="levelText">🥉 Bronze Fisher</small></div><div class="balance" onclick="showBalance()">💰 <span id="bal">1250</span> EFC</div></div>
<div class="energy-box"><div style="display:flex;justify-content:space-between"><span>⚡ ENERGY</span><span id="energyText">1000/1000</span></div><div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div></div>
<div class="pond" id="pond">
  <img src="cat-fish.jpg" id="fish" class="pond-img" onerror="this.style.display='none'; document.getElementById('fishEmoji').style.display='block'">
  <div id="fishEmoji" style="display:none;font-size:80px;z-index:3">😺</div>
  <div class="tap-text">TAP TO FISH!</div>
</div>
<div class="shop">
<div class="card"><div style="font-size:30px">🪝</div><b>Iron Rod</b><br><small>2x Earning</small><button onclick="buyRod()">500 EFC - BUY</button></div>
<div class="card" onclick="showLeaderboard()" style="cursor:pointer"><div style="font-size:30px">🏆</div><b>Leaderboard</b><br><div id="miniBal">0</div></div>
</div>
<div style="margin:15px 20px;background:#1e2540;border:1px dashed #FFD700;border-radius:15px;padding:15px;text-align:center">
<div style="color:#FFD700;font-weight:bold">10,000 Game EFC = 100 Real EFC</div>
<button onclick="openClaim()" style="background:#FFD700;border:none;padding:10px 20px;border-radius:10px;font-weight:bold;width:100%;margin-top:8px">🎁 Check Claim Status</button>
  </div>
  <div class="nav"><div id="navLearn" onclick="showQuiz()">📚<br>Learn</div><div id="navFish" class="active">🐟<br>Fish</div><div id="navFriends" onclick="invite()">👥<br>Friends</div><div id="navEarn" onclick="earn()">🎁<br>Earn</div></div>

<div id="quizModal"><div class="modal-box"><h3 style="color:#FFD700">📚 Quiz</h3><p id="quizQ"></p><button class="quiz-opt" id="qOpt1" onclick="answerQuiz(1)"></button><button class="quiz-opt" id="qOpt2" onclick="answerQuiz(2)"></button><div id="quizProgress" style="font-size:10px;opacity:0.5;margin-top:10px"></div><button class="btn-close" onclick="closeQuizModal()">Close</button></div></div>
<div id="claimModal"><div class="modal-box"><h3 style="color:#FFD700">🎁 Real EFC Claim</h3><p>Your Points: <b id="claimPoints" style="color:#FFD700">0</b></p><p style="font-size:13px;margin-top:10px">10,000 Points হলে 100 Real EFC পাবে। Claim Soon!</p><button class="btn-copy" onclick="checkClaimEligible()">Check Eligibility</button><button class="btn-close" onclick="closeClaim()">Close</button></div></div>
<div id="refModal"><div class="modal-box"><h3>Invite</h3><input id="refLinkInput" readonly><button class="btn-copy" onclick="copyRef()">COPY</button><button class="btn-close" onclick="closeRef()">Close</button></div></div>
<div id="balanceModal"><div class="modal-box"><div id="walletBal">0 EFC</div><button class="btn-close" onclick="closeBalance()">Close</button></div></div>
<div id="leaderModal"><div class="modal-box"><div id="myRankBal">0 EFC</div><button class="btn-close" onclick="closeLeaderboard()">Close</button></div></div>
<div id="appModal"><div class="modal-box"><h3 id="appModalTitle"></h3><p id="appModalText"></p><button class="btn-copy" onclick="closeAppModal()">OK</button></div></div>

<script>
const BOT_USERNAME = "EFC_FISH_BOT";
let tg=window.Telegram.WebApp; tg.expand();
let balance=parseInt(localStorage.getItem('efc_bal')||'1250');
let energy=parseInt(localStorage.getItem('efc_en')||'1000');
let perTap=parseInt(localStorage.getItem('efc_per')||'1');
let myId = localStorage.getItem('efc_my_id') || Math.floor(Math.random()*900000)+100000;
localStorage.setItem('efc_my_id', myId);

// QUIZ FIX - NO REPEAT
const allQuestions = [
{q:"Opposite of Hot?",o1:"Cold",o2:"Hot",ans:1},
{q:"Bitcoin is?",o1:"Crypto",o2:"Fish",ans:1},
{q:"Solana is fast?",o1:"Yes",o2:"No",ans:1},
{q:"EFC means?",o1:"Earn Fish Coin",o2:"Eat Fish Curry",ans:1},
{q:"Cat says?",o1:"Meow",o2:"Woof",ans:1},
{q:"Fishing needs?",o1:"Rod",o2:"Spoon",ans:1},
{q:"Pump.fun is on?",o1:"Solana",o2:"Bitcoin",ans:1},
{q:"Tap to earn?",o1:"Yes",o2:"No",ans:1},
{q:"Water is?",o1:"Wet",o2:"Dry",ans:1},
{q:"Gold Fisher is top?",o1:"Yes",o2:"No",ans:1}
];
function getAsked(){ try{return JSON.parse(localStorage.getItem('efc_asked')||'[]')}catch(e){return []} }
function saveAsked(a){ localStorage.setItem('efc_asked', JSON.stringify(a)); }
let currentQuiz=null; let currentQuizIndex=-1;
function showQuiz(){
 let asked=getAsked();
 let available=allQuestions.map((_,i)=>i).filter(i=>!asked.includes(i));
 if(available.length==0){ asked=[]; saveAsked([]); available=allQuestions.map((_,i)=>i); }
 let rand=available[Math.floor(Math.random()*available.length)];
 currentQuizIndex=rand; currentQuiz=allQuestions[rand];
 document.getElementById('quizQ').innerText=currentQuiz.q;
 document.getElementById('qOpt1').innerText=currentQuiz.o1;
 document.getElementById('qOpt2').innerText=currentQuiz.o2;
 document.getElementById('quizProgress').innerText=`Question ${asked.length+1}/${allQuestions.length}`;
 document.getElementById('quizModal').style.display='flex';
}
function answerQuiz(c){
 if(c==currentQuiz.ans){
  balance+=50; localStorage.setItem('efc_bal',balance);
  document.getElementById('bal').innerText=balance;
  let asked=getAsked(); asked.push(currentQuizIndex); saveAsked(asked);
 }
 document.getElementById('quizModal').style.display='none';
}
function closeQuizModal(){document.getElementById('quizModal').style.display='none';}
function openClaim(){ document.getElementById('claimPoints').innerText=balance; document.getElementById('claimModal').style.display='flex'; }
function closeClaim(){ document.getElementById('claimModal').style.display='none'; }
function checkClaimEligible(){
 if(balance>=10000){ alert('Eligible! Claim Soon খুললে প্রথমে পাবে।'); localStorage.setItem('efc_claim_eligible','true'); }
 else alert('আরো '+(10000-balance)+' Point লাগবে!');
}

// বাকি আগের ফাংশনগুলো একই থাকবে
document.getElementById('bal').innerText=balance;
function showBalance(){document.getElementById('balanceModal').style.display='flex';}
function closeBalance(){document.getElementById('balanceModal').style.display='none';}
function showLeaderboard(){document.getElementById('leaderModal').style.display='flex';}
function closeLeaderboard(){document.getElementById('leaderModal').style.display='none';}
function buyRod(){ if(balance>=500){ balance-=500; perTap=2; localStorage.setItem('efc_bal',balance); document.getElementById('bal').innerText=balance; } }
function invite(){ document.getElementById('refModal').style.display='flex'; }
function closeRef(){document.getElementById('refModal').style.display='none';}
function copyRef(){ navigator.clipboard.writeText(document.getElementById('refLinkInput').value); }
function earn(){ balance+=100; localStorage.setItem('efc_bal',balance); document.getElementById('bal').innerText=balance; }
function showAppModal(t,tx){document.getElementById('appModalTitle').innerText=t;document.getElementById('appModalText').innerText=tx;document.getElementById('appModal').style.display='flex';}
function closeAppModal(){document.getElementById('appModal').style.display='none';}
document.getElementById('pond').addEventListener('click',()=>{ if(energy>0){ energy--; balance+=perTap; document.getElementById('bal').innerText=balance; localStorage.setItem('efc_bal',balance);} });
</script>
</body>
</html>
